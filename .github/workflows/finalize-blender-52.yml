name: Finalize Blender 5.2 migration

on:
  push:
    branches:
      - migration/blender-5.2
    paths:
      - .github/blender-52-finalize-trigger.md

permissions:
  contents: write

concurrency:
  group: finalize-blender-52
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/blender-5.2
          fetch-depth: 0
          submodules: false

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Blender 5.2 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Pin upstream to Blender 5.2.0
        env:
          TARGET_SHA: fbe6228777e7d9afefcd61a413844e790ae75db7
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --force --depth 1 upstream
          git -C upstream fetch --depth 1 origin tag v5.2.0
          git -C upstream checkout --force --detach "$TARGET_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$TARGET_SHA"

      - name: Bring new 5.2 files into the overlay
        run: |
          set -euo pipefail
          mkdir -p src/source/blender/blenloader_core/intern
          cp upstream/source/blender/blenloader_core/intern/blo_core_blend_header.cc src/source/blender/blenloader_core/intern/
          mkdir -p src/source/blender/editors/space_file
          cp upstream/source/blender/editors/space_file/{space_file.cc,file_intern.hh} src/source/blender/editors/space_file/

      - name: Apply idempotent finalization
        run: python3 scripts/upgrade/finalize_blender_52.py

      - name: Run provider tests and static checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade/finalize_blender_52.py src/scripts/mixar/modules/byok/core/openai_models.py src/scripts/mixar/modules/byok/ui/operators/byok_custom_models_ops.py tests/test_byok_openai_models.py
          python3 -m pytest -q tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py
          if grep -RIl '^<<<<<<< ' src; then exit 1; fi
          grep -q '#define BLENDER_VERSION 502' src/source/blender/blenkernel/BKE_blender_version.h
          grep -q 'PYTHON_VERSION=3.13' scripts/windows/settings.bat
          grep -q 'PYTHON_VERSION:-3.13' scripts/unix/settings.sh
          ! grep -q 'if (win->ghostwin != nullptr ||' src/source/blender/windowmanager/intern/wm_files.cc
          ! grep -q 'void \*ghostwin_freed = win->ghostwin' src/source/blender/windowmanager/intern/wm_window.cc
          test "$(grep -c '^void wm_window_close(bContext' src/source/blender/windowmanager/intern/wm_window.cc)" -eq 1

      - name: Commit final Blender 5.2 tree
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete Blender 5.2 and custom provider integration'
          git push origin HEAD:refs/heads/migration/blender-5.2
