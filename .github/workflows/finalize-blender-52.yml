# SPDX-License-Identifier: GPL-2.0-or-later
name: Finalize Blender 5.2 migration
on:
  push:
    branches: [migration/blender-5.2]
    paths: [.github/blender-52-finalize-trigger.md]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: migration/blender-5.2, fetch-depth: 0, submodules: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - name: Run finalizer in durable stages
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          checkpoint() {
            printf '%s\n' "$1" > docs/migration/finalize-blender-52-stage.txt
            git add -A
            git commit -m "ci: Blender 5.2 stage - $1" || true
            git push origin HEAD:refs/heads/migration/blender-5.2
          }
          run_stage() {
            name=$1
            set +e
            python3 scripts/upgrade/run_finalize_stage.py "$name" > /tmp/stage.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              { echo '# Blender 5.2 finalization failure'; echo; echo "Run: $GITHUB_RUN_ID"; echo "Stage: $name"; echo '```text'; cat /tmp/stage.log; echo '```'; } > docs/migration/finalize-blender-52-failure.md
              checkpoint "$name-failed"
              exit "$rc"
            fi
            checkpoint "$name"
          }
          run_stage sync_python
          run_stage wire_provider
          run_stage port_cpp
          run_stage fix_checks
          run_stage guidance
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py
          ! grep -RIl '^<<<<<<< ' src
          rm -f docs/migration/finalize-blender-52-failure.md docs/migration/finalize-blender-52-stage.txt
          checkpoint tests-passed
