# SPDX-License-Identifier: GPL-2.0-or-later
name: Finalize Blender 5.2 migration
on:
  push:
    branches: [migration/blender-5.2]
    paths: [.github/blender-52-finalize-trigger.md]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: migration/blender-5.2, fetch-depth: 0, submodules: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          LOG=/tmp/finalize.log; exec > >(tee "$LOG") 2>&1
          failed() { rc=$?; trap - ERR; { echo '# Blender 5.2 finalization failure'; echo; echo "Run: $GITHUB_RUN_ID"; echo '```text'; tail -n 200 "$LOG"; echo '```'; } > docs/migration/finalize-blender-52-failure.md; git add docs/migration/finalize-blender-52-failure.md; git commit -m 'ci: update Blender 5.2 failure diagnostic' || true; git push origin HEAD:refs/heads/migration/blender-5.2 || true; exit $rc; }
          trap failed ERR
          python3 -m pip install -q pytest
          rm -rf upstream
          git clone --depth 1 --branch v5.2.0 https://projects.blender.org/blender/blender.git upstream
          test "$(git -C upstream rev-parse HEAD)" = fbe6228777e7d9afefcd61a413844e790ae75db7
          mkdir -p src/source/blender/{blenloader_core/intern,editors/space_file}
          cp upstream/source/blender/blenloader_core/intern/blo_core_blend_header.cc src/source/blender/blenloader_core/intern/
          cp upstream/source/blender/editors/space_file/{space_file.cc,file_intern.hh} src/source/blender/editors/space_file/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/upgrade/finalize_blender_52.py'); s=p.read_text()
          old='("operators/byok_custom_provider_ops.py", "operators/byok_custom_models_ops.py")'
          new='("ui/operators/byok_custom_provider_ops.py", "ui/operators/byok_custom_models_ops.py")'
          assert old in s or new in s
          p.write_text(s.replace(old,new))
          PY
          grep -q 'ui/operators/byok_custom_models_ops.py' scripts/upgrade/finalize_blender_52.py
          python3 scripts/upgrade/finalize_blender_52.py
          python3 -m pytest -q tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py
          ! grep -RIl '^<<<<<<< ' src
          rm -f docs/migration/finalize-blender-52-failure.md
          git add -A
          git commit -m 'fix: complete Blender 5.2 and custom provider integration'
          git push origin HEAD:refs/heads/migration/blender-5.2
