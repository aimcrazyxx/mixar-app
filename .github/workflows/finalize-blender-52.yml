# SPDX-License-Identifier: GPL-2.0-or-later
name: Finalize Blender 5.2 migration
on:
  push:
    branches: [migration/blender-5.2]
    paths: [.github/blender-52-finalize-trigger.md]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: migration/blender-5.2, fetch-depth: 0, submodules: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 -m pip install -q pytest
          git submodule update --init --force --depth 1 upstream
          git -C upstream fetch --depth 1 origin tag v5.2.0
          git -C upstream checkout --force fbe6228777e7d9afefcd61a413844e790ae75db7
          mkdir -p src/source/blender/{blenloader_core/intern,editors/space_file}
          cp upstream/source/blender/blenloader_core/intern/blo_core_blend_header.cc src/source/blender/blenloader_core/intern/
          cp upstream/source/blender/editors/space_file/{space_file.cc,file_intern.hh} src/source/blender/editors/space_file/
          sed -i 's#("operators/byok_custom_provider_ops.py", "operators/byok_custom_models_ops.py")#("ui/operators/byok_custom_provider_ops.py", "ui/operators/byok_custom_models_ops.py")#' scripts/upgrade/finalize_blender_52.py
          python3 scripts/upgrade/finalize_blender_52.py
          python3 -m pytest -q tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py
          ! grep -RIl '^<<<<<<< ' src
          rm -f docs/migration/finalize-blender-52-failure.md
          git add -A
          git commit -m 'fix: complete Blender 5.2 and custom provider integration'
          git push origin HEAD:refs/heads/migration/blender-5.2
