name: Capture Blender repair from automation PR
on:
  pull_request:
    types: [synchronize]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/blender-52-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture repair and audit workflow results
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sleep 10

          capture_workflow() {
            local workflow="$1"
            local label="$2"
            local run_id=""
            for _ in $(seq 1 120); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,createdAt,status,conclusion,url \
                --jq 'sort_by(.databaseId) | last | .databaseId // empty')"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$run_id" ]; then
              {
                echo "## $label"
                echo
                echo "No run found for \`$workflow\`."
                echo
              } >> /tmp/diagnostic.md
              return 0
            fi
            set +e
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 5 --exit-status
            set -e
            gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt,jobs \
              > "/tmp/${label}-summary.json"
            gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --log-failed \
              > "/tmp/${label}-failed.log" 2>&1 || true
            {
              echo "## $label"
              echo
              echo '```json'
              cat "/tmp/${label}-summary.json"
              echo '```'
              echo
              echo '```text'
              tail -n 400 "/tmp/${label}-failed.log"
              echo '```'
              echo
            } >> /tmp/diagnostic.md
          }

          {
            echo 'Automation diagnostics for the Blender 5.2 repair and expanded stale-API audit.'
            echo
          } > /tmp/diagnostic.md
          capture_workflow fix-blender-52-interface-handlers.yml repair
          capture_workflow scan-blender-52-apis.yml audit
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/diagnostic.md
