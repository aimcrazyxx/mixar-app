name: Build Windows (v3.3.3)

on:
  workflow_dispatch:
  push:
    branches:
      - release/v3.3.3
    paths:
      - "VERSION"
      - "src/**"
      - "scripts/windows/**"
      - "cmake/**"
      - ".gitmodules"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: mixar-v3.3.3-windows
  cancel-in-progress: true

permissions:
  contents: write

env:
  MIXAR_ENV: Prod
  BUILD_WITH_NINJA: "1"
  BUILD_CORES: "2"
  ROBOCOPY_THREADS: "16"

jobs:
  build-windows:
    name: Windows Release Build
    runs-on: windows-2022
    timeout-minutes: 600

    steps:
      - name: Configure Git for large Blender trees
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Reclaim runner disk space
        shell: pwsh
        continue-on-error: true
        run: |
          $targets = @(
            "C:\Android",
            "C:\Miniconda",
            "C:\Program Files\Google",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\Amazon",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\Program Files (x86)\Android",
            "C:\Program Files (x86)\Microsoft SDKs\Azure",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          )
          foreach ($target in $targets) {
            if (Test-Path $target) {
              Write-Host "Removing $target"
              Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C | Select-Object Used, Free | Format-List

      - name: Checkout repository and pinned Blender
        uses: actions/checkout@v4
        with:
          ref: release/v3.3.3
          submodules: true
          fetch-depth: 1
          lfs: false

      - name: Validate release and upstream pins
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "3.3.3") {
            throw "VERSION must be 3.3.3; found '$version'"
          }
          $expectedUpstream = (git rev-parse HEAD:upstream).Trim()
          $actualUpstream = (git -C upstream rev-parse HEAD).Trim()
          Write-Host "Mixar version: $version"
          Write-Host "Pinned upstream:  $expectedUpstream"
          Write-Host "Checked upstream: $actualUpstream"
          if ($expectedUpstream -ne $actualUpstream) {
            git -C upstream fetch origin $expectedUpstream --depth=1
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch Blender $expectedUpstream" }
            git -C upstream checkout --detach $expectedUpstream
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout Blender $expectedUpstream" }
          }

      - name: Checkout pinned Windows precompiled libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location upstream
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw "Git LFS initialization failed" }

          $treeLine = (git ls-tree HEAD -- lib/windows_x64).Trim()
          if (-not $treeLine) { throw "Blender tree has no lib/windows_x64 gitlink" }
          $parts = $treeLine -split '\s+'
          if ($parts.Count -lt 4 -or $parts[1] -ne "commit" -or $parts[2] -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to parse windows_x64 gitlink: $treeLine"
          }
          $expectedLib = $parts[2]
          Write-Host "Pinned windows_x64: $expectedLib"

          git config --local submodule.lib/windows_x64.update checkout
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable windows_x64 checkout" }
          git submodule sync -- lib/windows_x64

          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git submodule update --init --force --checkout --depth=1 -- lib/windows_x64
          $code = $LASTEXITCODE
          Remove-Item Env:GIT_LFS_SKIP_SMUDGE -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            Write-Host "Shallow windows_x64 checkout failed; retrying full-depth."
            git submodule update --init --force --checkout -- lib/windows_x64
            if ($LASTEXITCODE -ne 0) { throw "Failed to initialize windows_x64" }
          }

          $actualLib = (git -C lib/windows_x64 rev-parse HEAD).Trim()
          if ($actualLib -ne $expectedLib) {
            throw "windows_x64 pin mismatch: expected $expectedLib, got $actualLib"
          }

          git -C lib/windows_x64 lfs pull
          if ($LASTEXITCODE -ne 0) { throw "git lfs pull failed for windows_x64" }

          $probe = "lib/windows_x64/python/313/include/Python.h"
          if (-not (Test-Path $probe)) { throw "Missing library probe: $probe" }
          if ((Get-Item $probe).Length -lt 1KB) { throw "$probe is still an LFS pointer" }

          $bytes = (Get-ChildItem lib/windows_x64 -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Windows libraries: $([math]::Round($bytes / 1GB, 2)) GB"
          if ($bytes -lt 1GB) { throw "windows_x64 checkout is unexpectedly small" }
          Set-Location ..

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: 1.12.1

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake unavailable" }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja unavailable" }
          git lfs version
          if ($LASTEXITCODE -ne 0) { throw "Git LFS unavailable" }
          Get-PSDrive C | Select-Object Used, Free | Format-List

      - name: Prepare environment
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) { Copy-Item .env.example .env }
          Write-Host "MIXAR_ENV=$env:MIXAR_ENV"
          Write-Host "BUILD_CORES=$env:BUILD_CORES"

      - name: Build Mixar
        shell: cmd
        run: |
          call "scripts\windows\build.bat"
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Overlay bundled Mixar scripts
        shell: cmd
        run: |
          call "scripts\windows\install.bat"
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Validate build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "build\Prod\bin"
          if (-not (Test-Path $dir)) { throw "$dir not found" }
          $exe = Get-ChildItem $dir -Recurse -Filter mixar.exe -File | Select-Object -First 1
          if (-not $exe) { throw "mixar.exe was not produced" }
          if ($exe.Length -le 0) { throw "mixar.exe is empty" }
          Write-Host "Built: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Package portable Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "build\Prod\bin"
          $zip = "mixar-windows-v3.3.3.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=5 $zip "$dir\*"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip packaging failed" }
          if (-not (Test-Path $zip)) { throw "$zip was not created" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS.txt
          Write-Host "Artifact: $zip"
          Get-Content SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixar-windows-v3.3.3
          path: |
            mixar-windows-v3.3.3.zip
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Deploy GitHub Release v3.3.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "mixar-windows-v3.3.3.zip"
          if (-not (Test-Path $zip)) { throw "$zip missing before deploy" }

          gh release view v3.3.3 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v3.3.3 $zip SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create v3.3.3 $zip SHA256SUMS.txt `
              --target "${{ github.sha }}" `
              --title "Mixar v3.3.3" `
              --notes "Windows x64 portable release for Mixar v3.3.3, based on Blender 5.2." `
              --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release deploy failed" }

      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free | Format-List
          if (Test-Path "build\Prod\CMakeFiles\CMakeError.log") {
            Get-Content "build\Prod\CMakeFiles\CMakeError.log" -Tail 200
          }
          if (Test-Path "build\Prod\bin") {
            Get-ChildItem "build\Prod\bin" -Force | Select-Object Name, Length | Format-Table -AutoSize
          }
