# Windows build of Mixar v3.3.3 (Blender 5.x fork) triggered manually.
# Produces build\Prod\bin\ (mixar.exe + embedded python + scripts) as a zip artifact.

name: Build Windows (v3.3.3)

on:
  workflow_dispatch:
  push:
    branches:
      - release/v3.3.3
    paths:
      - "src/**"
      - ".github/workflows/build-windows.yml"

env:
  MIXAR_ENV: Prod
  ROBOCOPY_THREADS: "16"

jobs:
  build-windows:
    name: Windows Release Build
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release/v3.3.3
          submodules: recursive
          fetch-depth: 1
          lfs: false

      - name: Checkout upstream Blender at pinned commit
        shell: pwsh
        run: |
          $pinned = git rev-parse HEAD:upstream
          Write-Host "Pinned upstream commit: $pinned"
          Set-Location upstream
          git checkout $pinned --quiet
          git log --oneline -1
          Set-Location ..

      - name: Checkout Windows precompiled libs (LFS) AFTER upstream checkout
        shell: pwsh
        run: |
          # libs must be checked out AFTER the upstream tree is at the pinned
          # commit (git checkout wipes paths it does not know about), and the
          # pinned libs commit must be read from the upstream tree itself.
          Set-Location upstream
          $pinnedLib = git ls-tree HEAD:lib/windows_x64 2>$null
          if (-not $pinnedLib) {
              # lib/windows_x64 is a gitlink in the upstream tree; read its sha.
              $pinnedLib = git rev-parse HEAD:lib/windows_x64
          }
          Write-Host "Pinned libs commit: $pinnedLib"
          Set-Location ..
          if (Test-Path upstream/lib/windows_x64) { Remove-Item -Recurse -Force upstream/lib/windows_x64 }
          git clone --filter=blob:none https://projects.blender.org/blender/lib-windows_x64.git upstream/lib/windows_x64
          Set-Location upstream/lib/windows_x64
          git fetch origin $pinnedLib
          git checkout $pinnedLib --quiet
          git lfs pull
          Set-Location ../../..
          Write-Host "Libs checkout complete. Total: $([math]::Round((Get-ChildItem upstream/lib/windows_x64 -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1GB, 2)) GB"

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install cmake
        run: |
          choco install cmake --version 3.31.6 -y
          cmake --version

      - name: Prepare environment
        shell: cmd
        run: |
          echo MIXAR_ENV=%MIXAR_ENV%
          ninja --version

      - name: Build Mixar
        shell: cmd
        run: |
          call "scripts\windows\build.bat"
          if %ERRORLEVEL% neq 0 (
            echo Build failed
            exit /b 1
          )

      - name: Package artifact
        shell: pwsh
        run: |
          $dir = "build\Prod\bin"
          if (-not (Test-Path $dir)) { throw "build\Prod\bin not found" }
          $zip = "mixar-windows-v3.3.3.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zip -Force
          Write-Host "Artifact: $zip ($(Get-Item $zip).Length bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixar-windows-v3.3.3
          path: mixar-windows-v3.3.3.zip
          retention-days: 90
