#
# Builds Mixar on Windows against a pinned Blender revision and uploads a real
# installer (.exe) plus a portable zip.
#
# Which Blender: 5.0, and that is not a choice this workflow gets to make.
# src/ is not a patch set - it holds whole copies of Blender files, and
# overlay.bat writes them over upstream/ with src always winning. The version
# that actually compiles is the one in src/source/blender/blenkernel/
# BKE_blender_version.h, which reads BLENDER_VERSION 500. Pinning upstream to
# v5.2.0 mixed two releases and cost several runs: 5.2's
# dependency_targets.cmake asked for imported targets that only 5.2's
# platform_win32.cmake creates, and the 5.0 copy of that file had just
# overwritten it. "Check the overlay matches the pinned Blender revision" below
# now catches that in seconds. Moving to 5.2 for real means rebasing every
# vendored copy in src/ onto 5.2 first, then bumping the pin.
#
# Reality check before you start this: a from-scratch Blender build needs tens
# of GB of precompiled libraries and hours of CPU. GitHub-hosted Windows
# runners ship with roughly 14 GB free and are hard-killed at the 6 hour job
# limit, so the honest way to run this is a larger runner or a self-hosted
# Windows runner with VS 2022 (Desktop C++), CMake and Git LFS. windows-latest
# stays the default only so that a first attempt costs a single click. In
# practice the reclaim step below leaves 47 GB free and the libraries take 6.5
# GB of it, so disk has not been the binding constraint - time is.
#
# Two ways to start it:
#   * Actions -> "Build Windows installer" -> Run workflow  (full control)
#   * push to the ci/build-windows branch                   (uses the defaults)
#
# What makes a retry cheap: every compile goes through sccache, and the cache is
# saved even when the job is cancelled or times out, so the next run resumes
# instead of starting from zero. cmake/mixar_overrides.cmake enables
# WITH_WINDOWS_SCCACHE by itself as soon as sccache is on PATH.
#
# Reading a failure without opening the browser: the heavy steps tee their
# output into logs/, every stage records free disk, and a failed job posts the
# tails as a comment on the pull request for this branch. Anything that can only
# be seen in the raw Actions log is invisible to tooling, and that made three
# attempts guesswork.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (self-hosted or a larger runner recommended; windows-latest usually runs out of disk)"
        required: true
        default: "windows-latest"
      blender_ref:
        description: "Blender tag or commit to pin upstream/ to (must match the release src/ vendors)"
        required: true
        default: "v5.0.0"
      blender_version:
        description: "Blender X.Y resource directory version (must match the tag)"
        required: true
        default: "5.0"
      mixar_env:
        description: "Build environment"
        type: choice
        options:
          - Prod
          - UAT
          - Dev
        default: Prod
      backend_url:
        description: "Optional MIXAR_BACKEND_URL to bake into this build"
        required: false
        default: ""
      use_ninja:
        description: "Build with Ninja instead of MSBuild"
        type: boolean
        default: true
      make_installer:
        description: "Run NSIS to produce the .exe installer"
        type: boolean
        default: true
  push:
    branches:
      - ci/build-windows

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The failure report has to land somewhere an API token can read it back;
  # Actions run logs cannot be. A pull request comment is the reliable channel
  # because forks always have pull requests, while Issues start disabled.
  issues: write
  pull-requests: write

jobs:
  build:
    name: ${{ inputs.mixar_env || 'Prod' }} / Blender ${{ inputs.blender_version || '5.0' }}
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 600
    env:
      # Every value carries a literal fallback: on a push-triggered run the
      # inputs context is empty, and an empty runs-on or blender ref would fail
      # the run minutes in, after the checkout has already burned time.
      MIXAR_ENV: ${{ inputs.mixar_env || 'Prod' }}
      BLENDER_VERSION: ${{ inputs.blender_version || '5.0' }}
      BLENDER_REF: ${{ inputs.blender_ref || 'v5.0.0' }}
      BUILD_WITH_NINJA: ${{ github.event_name == 'workflow_dispatch' && (inputs.use_ninja && '1' || '0') || '1' }}
      MAKE_INSTALLER: ${{ github.event_name == 'workflow_dispatch' && (inputs.make_installer && 'true' || 'false') || 'true' }}
      # GIT_LFS_SKIP_SMUDGE is deliberately absent. It was set here as a
      # checkout speedup, but a job-level variable also applies to the fetch of
      # Blender's precompiled libraries, and those are git-lfs objects almost in
      # their entirety - skipping the smudge filter turns every one of them into
      # a 130 byte pointer that only fails at link time.
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      # Kept under GitHub's 10 GB per-repository cache budget on purpose.
      SCCACHE_CACHE_SIZE: 5G
    steps:
      - name: Configure git and derive short sha
        shell: pwsh
        run: |
          # Blender's source paths overflow MAX_PATH.
          #
          # autocrlf stays off so the repo's *.sh helpers keep their LF endings
          # under git bash. That also removes the conversion a Windows clone
          # normally applies, which is what the *.bat files were silently
          # depending on - .gitattributes is what guarantees they arrive as
          # CRLF now, and the next step proves it.
          git config --global core.longpaths true
          git config --global core.autocrlf false
          Add-Content -Path $env:GITHUB_ENV -Value "SHORT_SHA=$($env:GITHUB_SHA.Substring(0, 7))"

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Verify batch files use CRLF
        shell: pwsh
        run: |
          # cmd.exe mis-parses LF-only batch files by dropping the first
          # character of some lines: REM runs as EM, for as or, if as f. It
          # never says so - it just skips work. That silently emptied ROOT_DIR
          # in settings.bat and sent robocopy to D:\upstream\.
          #
          # With .gitattributes in place this should find nothing. It stays as
          # the safety net, and as the thing that names the file if it returns.
          # upstream/ is untouched on purpose: separate repository, its own
          # attributes, and its make.bat already parses fine.
          $files = Get-ChildItem -Recurse -File |
            Where-Object {
              @('.bat', '.cmd') -contains $_.Extension -and
              $_.FullName -notmatch '\\upstream\\'
            }
          $rewritten = @()
          foreach ($file in $files) {
            $raw = [System.IO.File]::ReadAllText($file.FullName)
            $crlf = ($raw -replace "`r`n", "`n") -replace "`n", "`r`n"
            if ($crlf -ne $raw) {
              [System.IO.File]::WriteAllText($file.FullName, $crlf)
              $rewritten += $file.FullName.Substring($PWD.Path.Length + 1)
            }
          }
          Write-Host "checked $($files.Count) batch file(s)"
          if ($rewritten.Count -eq 0) {
            Write-Host "all of them already use CRLF"
          } else {
            Write-Host "::warning::rewrote $($rewritten.Count) batch file(s) checked out with LF endings"
            $rewritten | ForEach-Object { Write-Host "  $_" }
          }

      - name: Start the disk ledger
        shell: pwsh
        run: |
          # Free space is sampled after every heavy stage and printed in full if
          # the job dies, so "it ran out of disk" stops being a hypothesis.
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $free = (Get-PSDrive C).Free / 1GB
          Set-Content -Path logs\disk.log -Value ("{0,-34} {1,8:N1} GB free" -f "after checkout", $free)
          Get-Content logs\disk.log

      - name: Report runner state
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free | Format-List
          cmake --version
          git --version
          git lfs version
          python --version
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            ninja --version
          } else {
            Write-Host "ninja: not on PATH (build.bat can still use the VS-bundled one)"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
            & $vswhere -latest -products * -property catalog_productDisplayVersion
          } else {
            Write-Host "vswhere not found - is Visual Studio installed?"
          }

      - name: Tune build parallelism
        shell: pwsh
        run: |
          # settings.bat defaults BUILD_CORES to NUMBER_OF_PROCESSORS-2, which
          # leaves half of a 4-core hosted runner idle for the whole build.
          # An environment variable wins over that default.
          $cores = [int]$env:NUMBER_OF_PROCESSORS
          if ($cores -lt 2) { $cores = 2 }
          Write-Host "BUILD_CORES=$cores (detected $env:NUMBER_OF_PROCESSORS logical processors)"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_CORES=$cores"

      - name: Reclaim disk space (hosted runners only)
        if: ${{ !contains(inputs.runner || 'windows-latest', 'self-hosted') }}
        continue-on-error: true
        shell: pwsh
        run: |
          $targets = @(
            "C:\Android",
            "C:\Miniconda",
            "C:\Program Files\Google",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\Amazon",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\Program Files (x86)\Android",
            "C:\Program Files (x86)\Microsoft SDKs\Azure",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          )
          foreach ($target in $targets) {
            if (Test-Path $target) {
              Write-Host "removing $target"
              Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
            }
          }
          $free = (Get-PSDrive C).Free / 1GB
          Add-Content -Path logs\disk.log -Value ("{0,-34} {1,8:N1} GB free" -f "after reclaim", $free)
          Get-Content logs\disk.log

      - name: Install NSIS, Ninja and sccache if missing
        shell: pwsh
        run: |
          $choco = Get-Command choco -ErrorAction SilentlyContinue
          if (-not $choco) {
            Write-Host "chocolatey not available - skipping tool install"
          } else {
            if ('${{ env.MAKE_INSTALLER }}' -eq 'true' -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
              choco install nsis -y --no-progress
            }
            if ('${{ env.BUILD_WITH_NINJA }}' -eq '1' -and -not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
            }
            # mixar_overrides.cmake turns on WITH_WINDOWS_SCCACHE the moment
            # this binary is on PATH, so installing it is the whole opt-in.
            if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
              choco install sccache -y --no-progress
            }
          }
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
          }

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ env.MIXAR_ENV }}-${{ env.BLENDER_REF }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.MIXAR_ENV }}-${{ env.BLENDER_REF }}-
            sccache-${{ runner.os }}-${{ env.MIXAR_ENV }}-

      - name: Pin upstream to the requested Blender revision
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately not scripts/windows/init.bat: it re-checks out upstream at
          # the gitlink recorded in the parent repo, which would undo this pin.
          git submodule sync --recursive
          git submodule update --init --force --depth 1 upstream
          git -C upstream fetch --tags --depth 1 origin "$BLENDER_REF"
          git -C upstream checkout --force --detach FETCH_HEAD
          git -C upstream log -1 --format='upstream pinned to %H%d'

      - name: Check the overlay matches the pinned Blender revision
        shell: bash
        run: |
          set -euo pipefail
          # The check that was missing while five runs failed.
          #
          # src/ holds whole copies of Blender files - CMakeLists.txt,
          # build_files/cmake/platform/*, macros.cmake, source/, intern/ - and
          # overlay.bat copies them over upstream/ with src always winning. So
          # the release being compiled is whatever src/ says, and pinning
          # upstream/ somewhere else silently blends two Blender versions in one
          # tree. When that happened, cmake died 25 minutes in on missing ALIAS
          # targets and a wrong Python version, and named neither cause.
          version_of() {
            local raw
            raw=$(grep -E '^#define BLENDER_VERSION[[:space:]]+[0-9]+' "$1" | awk '{print $3}')
            echo "$((raw / 100)).$((raw % 100))"
          }
          overlay=$(version_of src/source/blender/blenkernel/BKE_blender_version.h)
          pinned=$(version_of upstream/source/blender/blenkernel/BKE_blender_version.h)
          echo "overlay in src/     : Blender $overlay"
          echo "pinned upstream/    : Blender $pinned ($BLENDER_REF)"
          echo "BLENDER_VERSION env : $BLENDER_VERSION"

          if [ "$overlay" != "$pinned" ]; then
            echo "::error::src/ vendors Blender $overlay but upstream/ is pinned to Blender $pinned."
            echo "The overlay overwrites upstream, so this mixes two releases and cannot configure."
            echo "Either pin blender_ref to a v${overlay}.x tag, or rebase every vendored copy"
            echo "in src/ onto Blender $pinned before bumping the pin."
            exit 1
          fi
          if [ "$BLENDER_VERSION" != "$overlay" ]; then
            echo "::error::BLENDER_VERSION=$BLENDER_VERSION but the tree is Blender $overlay."
            echo "The resource directory and the packaging paths would both look in the wrong place."
            exit 1
          fi
          echo "overlay, pin and BLENDER_VERSION all agree on Blender $overlay"

          grep -n "BLENDER_VERSION=" scripts/windows/settings.bat scripts/unix/settings.sh || true
          if ! grep -q "BLENDER_VERSION=${BLENDER_VERSION}" scripts/windows/settings.bat; then
            echo "::warning::scripts/windows/settings.bat does not pin BLENDER_VERSION=${BLENDER_VERSION};" \
                 "run scripts/upgrade/set_blender_version.sh ${BLENDER_VERSION} ${BLENDER_REF}"
          fi

      - name: Fetch Blender precompiled libraries
        shell: pwsh
        working-directory: upstream
        run: |
          # Blender keeps its precompiled libraries in per-platform submodules.
          # .gitmodules registers all four of them like this:
          #
          #   [submodule "lib/windows_x64"]
          #       update = none
          #       path = lib/windows_x64
          #       url = https://projects.blender.org/blender/lib-windows_x64.git
          #       branch = blender-v5.0-release
          #
          # `update = none` makes a plain `git submodule update --init` walk
          # straight past them, and passing --checkout does not override it in
          # practice. make_update.py is the supported way in:
          # initialize_precompiled_libraries() writes
          # submodule.<path>.update=checkout into .git/config, and only then
          # submodules_lib_update() updates the submodule. This works - it
          # fetched 6.5 GB of libraries on the first run that used it.
          #
          # Calling the script directly also avoids the interactive "download
          # libraries? (y/n)" prompt - that comes from make.bat, not from here.
          # --no-blender skips the `git pull --rebase` that cannot work on a
          # detached tag checkout, and --no-lfs-fallback skips adding a second
          # remote to refetch LFS objects we are about to pull anyway.
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path ..\logs | Out-Null

          python build_files\utils\make_update.py --no-blender --no-lfs-fallback 2>&1 |
            Tee-Object -FilePath ..\logs\libs.log
          Write-Host "make_update.py exited with $LASTEXITCODE"

          if (-not (Test-Path lib\windows_x64\python)) {
            Write-Host "::warning::libraries still missing after make_update.py, forcing the submodule by hand"
            # The same two operations make_update.py performs, without the wrapper.
            git config submodule."lib/windows_x64".update checkout
            git submodule sync -- lib/windows_x64
            git submodule update --init --force --checkout -- lib/windows_x64 2>&1 |
              Tee-Object -Append -FilePath ..\logs\libs.log
            Write-Host "manual submodule update exited with $LASTEXITCODE"
          }

          # The libraries are git-lfs objects. Materialise them in case the
          # checkout only wrote the ~130 byte pointer files, which look fine to
          # cmake and fail hours later at link time.
          if (Test-Path lib\windows_x64) {
            git -C lib\windows_x64 lfs pull 2>&1 | Tee-Object -Append -FilePath ..\logs\libs.log
          }

          # Do not hardcode the Python version here. It belongs to whichever
          # Blender release is pinned - 5.0 ships python/311, 5.2 ships
          # python/313 - and cmake reads it off the lib folder itself. This
          # probe was pinned to 311, then "fixed" to 313, and both were guesses
          # about a value that can simply be looked up at runtime. The second
          # guess rejected a complete 6.5 GB library set. Accept what is there.
          $pythonHeader = $null
          foreach ($version in @("311", "313")) {
            $candidate = "lib\windows_x64\python\$version\include\Python.h"
            if (Test-Path $candidate) {
              $pythonHeader = $candidate
              break
            }
          }

          if (-not $pythonHeader) {
            # Everything here also goes into libs.log, so the diagnosis travels
            # with the failure report instead of dying in an Actions log that no
            # API token can read.
            $diag = New-Object System.Collections.Generic.List[string]
            function Add-Diag($title, $block) {
              $diag.Add("")
              $diag.Add("--- $title ---")
              try {
                & $block 2>&1 | ForEach-Object { $diag.Add([string]$_) }
              } catch {
                $diag.Add("(command failed: $_)")
              }
            }
            $diag.Add("=== no python/{311,313}/include/Python.h under lib\windows_x64 ===")
            Add-Diag "git submodule status" { git submodule status }
            Add-Diag "submodule config in .git/config" { git config --get-regexp '^submodule\.' }
            Add-Diag "submodule paths in .gitmodules" { git config -f .gitmodules --get-regexp '^submodule\..*\.(path|url|update)$' }
            Add-Diag "lib tree, three levels" { Get-ChildItem lib -Recurse -Depth 3 -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } }
            Add-Diag "git lfs env" { git lfs env }
            $diag | ForEach-Object { Write-Host $_ }
            $diag | Add-Content -Path ..\logs\libs.log
            throw "precompiled libraries missing: no python/{311,313}/include/Python.h under lib\windows_x64"
          }

          $size = (Get-Item $pythonHeader).Length
          if ($size -lt 1kb) {
            throw "precompiled libraries are git-lfs pointers, not real files ($pythonHeader is $size bytes)"
          }
          Write-Host "libraries present ($pythonHeader is $size bytes)"

          # A warning, not a failure: cmake names the exact missing target far
          # more precisely than a folder check can.
          $required = @("fmt", "opencolorio", "openexr", "OpenImageIO", "osl")
          $missing = $required | Where-Object { -not (Test-Path "lib\windows_x64\$_") }
          if ($missing) {
            Write-Host "::warning::library folders not found: $($missing -join ', ')"
          }
          Get-ChildItem lib\windows_x64 | Select-Object Name | Format-Table -AutoSize

      - name: Measure what the libraries cost
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          # git-lfs keeps every object twice: once under .git/lfs/objects and
          # once materialised in the working tree. overlay.bat now links lib\
          # into source\ instead of copying it, so these numbers are what say
          # whether that was enough to fit in the runner's disk.
          function Get-SizeGB($path) {
            if (-not (Test-Path $path)) { return "absent" }
            $bytes = (Get-ChildItem $path -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum).Sum
            return ("{0:N1} GB" -f ($bytes / 1GB))
          }
          $rows = @(
            [pscustomobject]@{ Path = "upstream\lib";        Size = Get-SizeGB "upstream\lib" }
            [pscustomobject]@{ Path = "upstream\.git";       Size = Get-SizeGB "upstream\.git" }
            [pscustomobject]@{ Path = "source";              Size = Get-SizeGB "source" }
            [pscustomobject]@{ Path = "build";               Size = Get-SizeGB "build" }
          )
          $rows | Format-Table -AutoSize
          $rows | ForEach-Object { Add-Content -Path logs\sizes.log -Value ("{0,-24} {1}" -f $_.Path, $_.Size) }
          $free = (Get-PSDrive C).Free / 1GB
          Add-Content -Path logs\disk.log -Value ("{0,-34} {1,8:N1} GB free" -f "after libraries", $free)
          Get-Content logs\disk.log

      - name: Apply backend URL override
        if: ${{ inputs.backend_url != '' }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "MIXAR_BACKEND_URL=${{ inputs.backend_url }}"

      - name: Prepare .env
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          }
          Write-Host "MIXAR_ENV=$env:MIXAR_ENV BLENDER_VERSION=$env:BLENDER_VERSION BUILD_WITH_NINJA=$env:BUILD_WITH_NINJA BUILD_CORES=$env:BUILD_CORES"

      - name: Build Mixar
        shell: pwsh
        run: |
          # Run through pwsh rather than shell: cmd purely so the output can be
          # teed to a file the failure report can quote.
          & cmd /c "call scripts\windows\build.bat" 2>&1 | Tee-Object -FilePath logs\build.log
          $code = $LASTEXITCODE
          $free = (Get-PSDrive C).Free / 1GB
          Add-Content -Path logs\disk.log -Value ("{0,-34} {1,8:N1} GB free" -f "after build.bat (exit $code)", $free)
          if ($code -ne 0) { throw "build.bat exited with $code" }

      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ env.MIXAR_ENV }}-${{ env.BLENDER_REF }}-${{ github.sha }}

      - name: Overlay Mixar scripts into the bundle
        shell: cmd
        run: call scripts\windows\install.bat

      - name: Package installer and portable zip
        shell: cmd
        env:
          PACKAGE_EXTRA: ${{ env.MAKE_INSTALLER == 'true' && ' ' || '--no-installer' }}
        run: call scripts\windows\package.bat --suffix %SHORT_SHA% %PACKAGE_EXTRA%

      - name: Summarize artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Select-Object Name, @{ Name = 'MiB'; Expression = { [math]::Round($_.Length / 1MB, 1) } } |
            Format-Table -AutoSize
          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summary -Value "## Mixar Windows build"
          Add-Content -Path $summary -Value "- Blender: $env:BLENDER_REF (resources $env:BLENDER_VERSION)"
          Add-Content -Path $summary -Value "- Environment: $env:MIXAR_ENV"
          Add-Content -Path $summary -Value "- Commit: $env:SHORT_SHA"
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "SHA-256:"
          if (Test-Path dist/SHA256SUMS.txt) {
            Get-Content dist/SHA256SUMS.txt | ForEach-Object { Add-Content -Path $summary -Value "    $_" }
          }

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: Mixar-${{ env.MIXAR_ENV }}-blender${{ env.BLENDER_VERSION }}-${{ env.SHORT_SHA }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the failure report
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An Actions log can only be read by a human with a browser. A pull
          # request comment can be read by anything holding a token, which is
          # the whole point.
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          $out.Add("Commit: ${{ github.sha }}")
          $out.Add("Runner: ${{ runner.os }} / ${{ inputs.runner || 'windows-latest' }}")
          $out.Add("")

          function Add-Block($title, $path, $tail) {
            $out.Add("")
            $out.Add("## $title")
            if (Test-Path $path) {
              $out.Add('```')
              Get-Content $path -Tail $tail -ErrorAction SilentlyContinue |
                ForEach-Object { $out.Add($_) }
              $out.Add('```')
            } else {
              $out.Add("not produced - the job died before this file existed")
            }
          }

          Add-Block "Free disk after each stage" "logs\disk.log" 40
          Add-Block "Directory sizes" "logs\sizes.log" 40
          Add-Block "Library fetch (tail)" "logs\libs.log" 150
          Add-Block "build.bat (tail)" "logs\build.log" 200
          Add-Block "CMakeError.log (tail)" "build\$env:MIXAR_ENV\CMakeFiles\CMakeError.log" 120

          $out.Add("")
          $out.Add("## Free space right now")
          $out.Add('```')
          $drive = Get-PSDrive C
          $out.Add(("free {0:N1} GB, used {1:N1} GB" -f ($drive.Free / 1GB), ($drive.Used / 1GB)))
          $out.Add('```')

          Set-Content -Path failure-report.md -Value $out -Encoding utf8
          # Mirrored into the job summary so the same text is one click away.
          Get-Content failure-report.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          # --state all, not --state open: once the pull request for this branch
          # was merged, --state open matched nothing and the report was silently
          # dropped. Merged pull requests still accept comments.
          $pr = gh pr list --repo $env:GITHUB_REPOSITORY --head $env:GITHUB_REF_NAME --state all --json number --jq '.[0].number'
          if ($pr) {
            gh pr comment $pr --repo $env:GITHUB_REPOSITORY --body-file failure-report.md
            Write-Host "reported on pull request #$pr"
          } else {
            Write-Host "no pull request for $env:GITHUB_REF_NAME - trying Issues"
            gh issue create --repo $env:GITHUB_REPOSITORY `
              --title "Windows build failed - run ${{ github.run_id }}" `
              --body-file failure-report.md
          }

      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free | Format-List
          if (Test-Path logs\disk.log) { Get-Content logs\disk.log }
          $errorLog = "build\$env:MIXAR_ENV\CMakeFiles\CMakeError.log"
          if (Test-Path $errorLog) {
            Write-Host "--- tail of $errorLog ---"
            Get-Content $errorLog -Tail 200
          }
          if (Test-Path "build\$env:MIXAR_ENV\bin") {
            Get-ChildItem "build\$env:MIXAR_ENV\bin" | Select-Object Name | Format-Table -AutoSize
          }

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
