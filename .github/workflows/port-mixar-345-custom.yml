name: Port Mixar 3.4.5 custom changes

on:
  push:
    branches:
      - release/v3.4.5-custom

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official 3.4.5 based branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.4.5-custom
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch migrated source branch
        shell: bash
        run: |
          git remote add migrated https://github.com/aimcrazyxx/mixar-app3.git
          git fetch --depth=1 migrated release/v3.4.5

      - name: Copy only custom files from migrated branch
        shell: bash
        run: |
          git checkout FETCH_HEAD -- \
            CLAUDE.md \
            VERSION \
            cmake/mixar_overrides.cmake \
            scripts/generate_config.py \
            scripts/windows/init.bat \
            scripts/windows/settings.bat \
            src/scripts/mixar/modules/auth/core/device.py \
            src/scripts/mixar/modules/byok/constants.py \
            src/scripts/mixar/modules/byok/core/agent_loop.py \
            src/scripts/mixar/modules/byok/core/byok_client.py \
            src/scripts/mixar/modules/byok/core/custom_agent_runtime.py \
            src/scripts/mixar/modules/byok/core/custom_model_cache.py \
            src/scripts/mixar/modules/byok/core/debug_report.py \
            src/scripts/mixar/modules/byok/core/model_suggestions.py \
            src/scripts/mixar/modules/byok/core/openai_compatible.py \
            src/scripts/mixar/modules/byok/core/openai_compatible_http.py \
            src/scripts/mixar/modules/byok/core/openai_compatible_parse.py \
            src/scripts/mixar/modules/byok/core/openai_compatible_relay.py \
            src/scripts/mixar/modules/byok/core/openai_compatible_wire.py \
            src/scripts/mixar/modules/byok/core/provider_types.py \
            src/scripts/mixar/modules/byok/ui/components/openai_compatible_draw.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_dialog_ui.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_ops.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_state_ops.py \
            src/scripts/mixar/modules/byok/ui/operators/openai_compatible_ops.py \
            src/scripts/mixar/modules/byok/ui/properties/byok_props.py \
            src/scripts/mixar/modules/common/api/services/agent_service.py \
            src/scripts/mixar/modules/common/generation_params/core/selector.py \
            src/scripts/mixar/modules/common/job_queue/core/job.py \
            src/scripts/mixar/modules/common/job_queue/core/queue_manager.py \
            src/scripts/mixar/modules/common/secure_storage.py \
            src/scripts/mixar/modules/moodboard/core/tripo_catalog.py \
            src/scripts/mixar/modules/moodboard/core/tripo_client.py \
            src/scripts/mixar/modules/moodboard/core/tripo_direct_job.py \
            src/scripts/mixar/modules/moodboard/core/tripo_p1_client.py \
            src/scripts/mixar/modules/moodboard/core/tripo_p1_job.py \
            src/scripts/mixar/modules/moodboard/core/turnaround_views.py \
            src/scripts/mixar/modules/moodboard/ui/model_gen_drawer.py \
            src/scripts/mixar/modules/moodboard/ui/moodboard_tab_properties.py \
            src/scripts/mixar/modules/moodboard/ui/operators/model_gen_ops.py \
            src/scripts/mixar/modules/moodboard/ui/sidebar_panel_drawers.py \
            src/scripts/mixar/modules/space_mixie_chat/constants.py \
            src/scripts/mixar/modules/space_mixie_chat/core/chat_history.py \
            src/scripts/mixar/modules/space_mixie_chat/core/jsonrpc_client.py \
            src/scripts/mixar/modules/space_mixie_chat/core/sse_handler.py \
            src/scripts/mixar/modules/space_mixie_chat/ui/operators/chat_ops.py \
            src/scripts/mixar/modules/space_mixie_chat/ui/operators/chat_special_ops.py \
            src/scripts/mixar/modules/space_mixie_chat/ui/operators/history_ops.py \
            src/scripts/mixar/modules/space_mixie_chat/ui/operators/session_ops.py \
            src/source/blender/blenkernel/BKE_blender_version.h \
            src/source/blender/editors/interface/templates/interface_template_search_menu.cc \
            tests/moodboard/test_catalog_model_resolution.py \
            tests/moodboard/test_tripo_client.py \
            tests/moodboard/test_tripo_p1_client.py \
            tests/moodboard/test_tripo_p1_job.py \
            tests/moodboard/test_turnaround_views.py \
            tests/test_byok_api_key.py \
            tests/test_openai_compatible_agent.py \
            tests/test_openai_compatible_relay.py

      - name: Remove one-off migration workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/port-mixar-345-custom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "feat: port custom integrations onto official Mixar 3.4.5"
          git push origin HEAD:release/v3.4.5-custom
