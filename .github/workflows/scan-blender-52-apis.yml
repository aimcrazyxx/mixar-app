name: Scan Blender 5.2 compatibility

on:
  workflow_dispatch:
    inputs:
      build_after_scan:
        description: "Start the Windows build when the fast audit is clean"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "scripts/upgrade/**"
      - "scripts/windows/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/scan-blender-52-apis.yml"
  push:
    branches:
      - main
      - ci/build-windows
    paths:
      - "src/**"
      - "scripts/upgrade/**"
      - "scripts/windows/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/scan-blender-52-apis.yml"

concurrency:
  group: blender-52-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  scan:
    name: Fast source audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact revision being validated
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Python version
        run: python3 --version

      - name: Audit Mixar source before expensive compilation
        run: |
          set -euo pipefail
          python3 scripts/upgrade/audit_blender_52_tree.py src --repository-mode | tee blender-52-preflight.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-52-preflight-${{ github.run_id }}
          path: blender-52-preflight.log
          if-no-files-found: warn
          retention-days: 7

      - name: Start full Windows validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_after_scan }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f runner=windows-latest \
            -f blender_ref=v5.2.0 \
            -f blender_version=5.2 \
            -f mixar_env=Prod \
            -f backend_url= \
            -f use_ninja=true \
            -f make_installer=true
