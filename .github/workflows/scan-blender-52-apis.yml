name: Scan Blender 5.2 API remnants
on:
  push:
    branches:
      - migration/blender-5.2
    paths:
      - ".github/workflows/scan-blender-52-apis.yml"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/blender-5.2
          fetch-depth: 0
          submodules: false
      - name: Port known Blender 5.2 APIs and rescan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src")
          suffixes = {".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp", ".cmake", ".txt"}
          files = [p for p in root.rglob("*") if p.is_file() and (p.suffix in suffixes or p.name == "CMakeLists.txt")]
          counts = {name: 0 for name in ("uiLayout", "uiBut", "uiBlock", "ghostwin", "MEM_callocN", "absolute_block", "ui_api")}
          ui_api_mappings = {
              "UI_block_begin": "::blender::ui::block_begin",
              "UI_block_end": "::blender::ui::block_end",
              "UI_popup_menu_retval_set": "::blender::ui::popup_menu_retval_set",
          }

          for path in files:
              value = path.read_text(encoding="utf-8", errors="replace")
              original = value
              value = value.replace("struct uiLayout;", "namespace blender::ui {\nstruct Layout;\n}")
              value = value.replace("struct uiBut;", "namespace blender::ui {\nstruct Button;\n}")
              value = value.replace("struct uiBlock;", "namespace blender::ui {\nstruct Block;\n}")
              value, count = re.subn(r"\buiLayout\b", "::blender::ui::Layout", value)
              counts["uiLayout"] += count
              value, count = re.subn(r"\buiBut\b", "::blender::ui::Button", value)
              counts["uiBut"] += count
              value, count = re.subn(r"\buiBlock\b", "::blender::ui::Block", value)
              counts["uiBlock"] += count
              value, count = re.subn(r"->absolute_block\s*\(\s*\)", "->absolute(false).block()", value)
              counts["absolute_block"] += count
              value, count = re.subn(r"(?<!runtime)->ghostwin\b", "->runtime->ghostwin", value)
              counts["ghostwin"] += count
              value, count = re.subn(r"\bMEM_callocN\s*<", "MEM_new_zeroed<", value)
              counts["MEM_callocN"] += count
              for old, new in ui_api_mappings.items():
                  value, count = re.subn(rf"\b{re.escape(old)}\b", new, value)
                  counts["ui_api"] += count
              if value != original:
                  path.write_text(value, encoding="utf-8")

          patterns = [
              ("legacy uiLayout type", re.compile(r"\buiLayout\b"), True),
              ("legacy uiBut type", re.compile(r"\buiBut\b"), True),
              ("legacy uiBlock type", re.compile(r"\buiBlock\b"), True),
              ("removed absolute_block call", re.compile(r"absolute_block\s*\("), True),
              ("obsolete fmtlib target", re.compile(r"bf::extern::fmtlib"), True),
              ("direct ghostwin access", re.compile(r"(?<!runtime)->ghostwin\b"), True),
              ("obsolete typed MEM_callocN", re.compile(r"MEM_callocN\s*<"), True),
              ("legacy uiPopupMenu type", re.compile(r"\buiPopupMenu\b"), True),
              ("legacy uiPopupBlockHandle type", re.compile(r"\buiPopupBlockHandle\b"), True),
              ("remaining uppercase UI API", re.compile(r"\bUI_(?:block|but|popup)_[A-Za-z0-9_]+\b"), False),
              ("tooltip helper occurrences", re.compile(r"UI_layout_disable_last_button_tooltip"), False),
              ("merge conflict marker", re.compile(r"^(?:<<<<<<<|=======|>>>>>>>)"), True),
          ]
          report_path = Path("docs/migration/blender-52-api-scan.md")
          prefix = report_path.read_text(encoding="utf-8").split("# Blender 5.2 API scan", 1)[0]
          out = [prefix.rstrip(), "", "# Blender 5.2 API scan", "", "## Applied ports", ""]
          out.extend([
              f"- `uiLayout` → `blender::ui::Layout`: **{counts['uiLayout']}**",
              f"- `uiBut` → `blender::ui::Button`: **{counts['uiBut']}**",
              f"- `uiBlock` → `blender::ui::Block`: **{counts['uiBlock']}**",
              f"- `absolute_block()` → `absolute(false).block()`: **{counts['absolute_block']}**",
              f"- `wmWindow::ghostwin` → `wmWindow::runtime->ghostwin`: **{counts['ghostwin']}**",
              f"- `MEM_callocN<T>` → `MEM_new_zeroed<T>`: **{counts['MEM_callocN']}**",
              f"- Renamed UI function calls: **{counts['ui_api']}**",
              "",
          ])
          blocking_hits = 0
          for label, pattern, blocking in patterns:
              hits = []
              for path in files:
                  for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                      if pattern.search(line):
                          hits.append(f"- `{path}:{number}` — `{line.strip()}`")
              if blocking:
                  blocking_hits += len(hits)
              out.extend([f"## {label}", "", f"Count: **{len(hits)}**", ""])
              out.extend(hits[:300] or ["- None"])
              if len(hits) > 300:
                  out.append(f"- … {len(hits) - 300} more")
              out.append("")
          out.extend(["## Summary", "", f"Blocking stale-pattern hits: **{blocking_hits}**", ""])
          report_path.write_text("\n".join(out), encoding="utf-8")
          if blocking_hits:
              raise RuntimeError(f"{blocking_hits} blocking Blender 5.2 API remnants remain")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src docs/migration/blender-52-api-scan.md
          git commit -m "fix: port renamed Blender 5.2 UI functions"
          git push origin HEAD:refs/heads/migration/blender-5.2
