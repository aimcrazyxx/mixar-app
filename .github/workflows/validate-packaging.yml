name: Validate packaging
on:
  push:
    paths:
      - "installer/**"
      - "scripts/packaging/**"
      - "scripts/upgrade/**"
      - "scripts/python_requirements.txt"
      - "src/scripts/mixar/modules/byok/**"
      - "src/scripts/mixar/modules/testing/mock_bpy.py"
      - "src/scripts/mixar/modules/space_mixie_chat/core/provider_errors.py"
      - "src/scripts/mixar/modules/space_mixie_chat/core/steps_format.py"
      - "tests/**"
      - ".github/workflows/validate-packaging.yml"
  pull_request:
    paths:
      - "installer/**"
      - "scripts/packaging/**"
      - "scripts/upgrade/**"
      - "scripts/python_requirements.txt"
      - "src/scripts/mixar/modules/byok/**"
      - "src/scripts/mixar/modules/testing/mock_bpy.py"
      - "src/scripts/mixar/modules/space_mixie_chat/core/provider_errors.py"
      - "src/scripts/mixar/modules/space_mixie_chat/core/steps_format.py"
      - "tests/**"
      - ".github/workflows/validate-packaging.yml"
  workflow_dispatch:
concurrency:
  group: validate-packaging-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  packaging:
    name: Packaging and NSIS script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          makensis -VERSION
      - name: Byte-compile every file this fork owns
        run: |
          python3 -m compileall -q \
            scripts/packaging \
            src/scripts/mixar/modules/byok/core/base_url.py \
            src/scripts/mixar/modules/byok/core/custom_provider.py \
            src/scripts/mixar/modules/byok/core/openai_models.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_base_url_ops.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_custom_provider_ops.py \
            src/scripts/mixar/modules/byok/ui/operators/byok_custom_models_ops.py \
            src/scripts/mixar/modules/space_mixie_chat/core/provider_errors.py \
            src/scripts/mixar/modules/space_mixie_chat/core/steps_format.py \
            tests/test_byok_base_url.py \
            tests/test_byok_custom_provider.py \
            tests/test_byok_openai_models.py \
            tests/test_provider_errors.py
          bash -n scripts/upgrade/set_blender_version.sh
      - name: Self-test the packager and compile the installer
        run: |
          python3 scripts/packaging/validate_installer.py \
            --keep-artifacts "${{ runner.temp }}/pkgcheck"
      - name: Describe the generated installer
        run: |
          ls -lh "${{ runner.temp }}/pkgcheck"
          file "${{ runner.temp }}"/pkgcheck/*-setup.exe
          {
            echo "### Packaging check"
            echo
            echo "NSIS: $(makensis -VERSION)"
            echo
            echo "The installer below wraps a stub executable. It proves the NSIS"
            echo "script compiles and the safety checks fire - it is not Mixar."
            echo
            echo '```'
            cat "${{ runner.temp }}/pkgcheck/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the stub installer
        uses: actions/upload-artifact@v5
        with:
          name: nsis-syntax-check-not-a-real-build
          path: ${{ runner.temp }}/pkgcheck/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Install standalone test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest numpy
          python3 -m pip install --disable-pip-version-check -r scripts/python_requirements.txt
      - name: Test the modules this fork owns
        run: |
          for t in tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py tests/test_provider_errors.py; do
            test -f "$t" || { echo "::error::$t is missing"; exit 1; }
          done
          python3 -m pytest -q -p no:cacheprovider \
            tests/test_byok_base_url.py tests/test_byok_custom_provider.py \
            tests/test_byok_openai_models.py tests/test_provider_errors.py
      - name: Full test suite (informational)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m pytest -q -p no:cacheprovider \
            --continue-on-collection-errors tests \
            2>&1 | tee full-test-suite.log
          status=${PIPESTATUS[0]}
          tail -80 full-test-suite.log | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload full-suite diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: full-test-suite-${{ github.run_id }}
          path: full-test-suite.log
          if-no-files-found: warn
          retention-days: 7
