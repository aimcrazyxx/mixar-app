name: Repair current Blender 5.2 Windows failures

on:
  push:
    branches:
      - fix/blender-52-build-20260816

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blender-52-build-20260816
          fetch-depth: 0
          submodules: false

      - name: Repair Blender 5.2 interface API drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/source/blender/editors/interface')

          # Blender 5.2 moved Block's owned button storage to buttons_ptrs.
          p = root / 'interface_mixar_section.cc'
          s = p.read_text(encoding='utf-8')
          s = s.replace('block->buttons', 'block->buttons_ptrs')
          s = s.replace('const bTheme *btheme = UI_GetTheme();',
                        'const bTheme *btheme = ::blender::ui::theme::theme_get();')
          marker = '#include "UI_interface_layout.hh"\n'
          if 'using namespace blender;  // Blender 5.2 DNA/BLF/GPU types live in blender.\n' not in s:
              if marker not in s:
                  raise RuntimeError('interface_mixar_section include marker not found')
              s = s.replace(marker, marker + '\nusing namespace blender;  // Blender 5.2 DNA/BLF/GPU types live in blender.\n', 1)
          p.write_text(s, encoding='utf-8')

          # ARegion is in namespace blender in 5.2. A global forward declaration creates
          # an unrelated incomplete type and breaks every region/View2D member access.
          p = root / 'interface_mixar_section.hh'
          s = p.read_text(encoding='utf-8')
          s = s.replace('namespace blender::ui {\nstruct Layout;\n}\n',
                        'namespace blender {\nstruct ARegion;\nnamespace ui {\nstruct Layout;\n}\n}\n')
          s = s.replace('\nstruct ARegion;\n\n/**\n * Draw a custom styled panel category tab bar for the MIXIE space.',
                        '\n/**\n * Draw a custom styled panel category tab bar for the MIXIE space.')
          s = s.replace('void UI_panel_category_draw_all_mixar(ARegion *region, const char *category_id_active);',
                        'void UI_panel_category_draw_all_mixar(::blender::ARegion *region, const char *category_id_active);')
          p.write_text(s, encoding='utf-8')

          # Blender 5.2 removed the old helper and renamed the Block storage.
          p = root / 'interface_layout.cc'
          s = p.read_text(encoding='utf-8')
          old = '''  ui::Block *block = layout->block();
          if (!block || block->buttons.is_empty()) {
            return;
          }
          but_drawflag_enable(block->buttons.last().get(), BUT_NO_TOOLTIP);'''
          new = '''  ui::Block *block = layout->block();
          if (!block || block->buttons_ptrs.is_empty()) {
            return;
          }
          block->buttons_ptrs.last()->drawflag |= BUT_NO_TOOLTIP;'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # Be tolerant of indentation/context changes while still performing only
              # the two narrowly-scoped API migrations.
              s = s.replace('block->buttons.is_empty()', 'block->buttons_ptrs.is_empty()')
              s = s.replace('but_drawflag_enable(block->buttons.last().get(), BUT_NO_TOOLTIP);',
                            'block->buttons_ptrs.last()->drawflag |= BUT_NO_TOOLTIP;')
          p.write_text(s, encoding='utf-8')

          # Fail immediately if the exact stale APIs from Windows build #34 remain.
          checks = {
              root / 'interface_mixar_section.cc': ['block->buttons.', 'block->buttons[', 'UI_GetTheme()'],
              root / 'interface_layout.cc': ['block->buttons.is_empty()',
                                             'but_drawflag_enable(block->buttons.last().get(), BUT_NO_TOOLTIP)'],
          }
          for path, stale in checks.items():
              text = path.read_text(encoding='utf-8')
              for token in stale:
                  if token in text:
                      raise RuntimeError(f'stale Blender 5.2 API remains in {path}: {token}')
          PY

          git diff --check
          git diff -- src/source/blender/editors/interface/interface_mixar_section.cc \
                       src/source/blender/editors/interface/interface_mixar_section.hh \
                       src/source/blender/editors/interface/interface_layout.cc

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/source/blender/editors/interface/interface_mixar_section.cc \
                  src/source/blender/editors/interface/interface_mixar_section.hh \
                  src/source/blender/editors/interface/interface_layout.cc
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: port remaining interface code to Blender 5.2'
          git push origin HEAD:fix/blender-52-build-20260816
