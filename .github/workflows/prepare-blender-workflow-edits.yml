# SPDX-License-Identifier: GPL-2.0-or-later
name: Prepare Blender workflow edits
on:
  push:
    branches: [migration/blender-5.2]
    paths: [.github/prepare-workflow-edits-trigger.md]
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: migration/blender-5.2, fetch-depth: 0, submodules: false}
      - name: Generate compact workflow files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def compact(text):
              body = "\n".join(
                  line.rstrip()
                  for line in text.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              )
              return "# SPDX-FileCopyrightText: 2026 Mixar fork contributors\n# SPDX-License-Identifier: GPL-3.0-or-later\n" + body + "\n"

          build_path = Path('.github/workflows/build-windows.yml')
          build = build_path.read_text(encoding='utf-8')
          old_probe = r'lib\windows_x64\python\311\include\Python.h'
          new_probe = r'lib\windows_x64\python\313\include\Python.h'
          if old_probe not in build:
              raise RuntimeError('Windows Python 3.11 probe not found')
          build = build.replace(old_probe, new_probe)

          validation = Path('.github/workflows/validate-packaging.yml').read_text(encoding='utf-8')
          validation = validation.replace('python-version: "3.11"', 'python-version: "3.13"')
          validation = validation.replace(
              '      - "tests/test_byok_base_url.py"\n',
              '      - "tests/test_byok_base_url.py"\n'
              '      - "tests/test_byok_custom_provider.py"\n'
              '      - "tests/test_byok_openai_models.py"\n',
          )
          validation = validation.replace(
              '            src/scripts/mixar/modules/byok/core/custom_provider.py \\\n',
              '            src/scripts/mixar/modules/byok/core/custom_provider.py \\\n'
              '            src/scripts/mixar/modules/byok/core/openai_models.py \\\n',
          )
          validation = validation.replace(
              '            src/scripts/mixar/modules/byok/ui/operators/byok_custom_provider_ops.py \\\n',
              '            src/scripts/mixar/modules/byok/ui/operators/byok_custom_provider_ops.py \\\n'
              '            src/scripts/mixar/modules/byok/ui/operators/byok_custom_models_ops.py \\\n',
          )
          validation = validation.replace(
              '            tests/test_byok_custom_provider.py \\\n',
              '            tests/test_byok_custom_provider.py \\\n'
              '            tests/test_byok_openai_models.py \\\n',
          )
          validation = validation.replace(
              'for t in tests/test_byok_base_url.py tests/test_provider_errors.py; do',
              'for t in tests/test_byok_base_url.py tests/test_byok_custom_provider.py tests/test_byok_openai_models.py tests/test_provider_errors.py; do',
          )
          validation = validation.replace(
              '            tests/test_byok_base_url.py tests/test_provider_errors.py',
              '            tests/test_byok_base_url.py tests/test_byok_custom_provider.py \\\n'
              '            tests/test_byok_openai_models.py tests/test_provider_errors.py',
          )
          required = ('python-version: "3.13"', 'core/openai_models.py', 'operators/byok_custom_models_ops.py', 'tests/test_byok_openai_models.py')
          if not all(item in validation for item in required):
              raise RuntimeError('Packaging workflow edit incomplete')

          out = Path('docs/migration/generated-workflows')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'build-windows.yml').write_text(compact(build), encoding='utf-8')
          (out / 'validate-packaging.yml').write_text(compact(validation), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/generated-workflows
          git commit -m 'ci: generate Blender 5.2 workflow updates'
          git push origin HEAD:refs/heads/migration/blender-5.2
